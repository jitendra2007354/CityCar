<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CityCar Ride Booking</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Use Inter font (Tailwind default) and configure colors to match App.tsx theme -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Corrected Custom colors derived from main project's index.html
                        'taxi-dark': '#111827', // Deep Charcoal/Black
                        'taxi-yellow': '#F7C948', // Vibrant Yellow Accent
                        'whatsapp-green': '#25D366',
                        'whatsapp-dark': '#1DA851',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        /* Shared Styles */
        .car-icon { fill: #111827; } /* taxi-dark */
        .min-h-screen { min-height: 100vh; }
        .main-content {
            margin-top: 5rem; /* Space below the fixed navbar */
            margin-bottom: 2rem;
        }

        /* SVG for Phone icon (Simulating Lucide-react Phone) */
        .phone-icon {
            fill: none;
            stroke: #111827; /* taxi-dark */
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body class="bg-gray-100 flex flex-col items-center justify-center min-h-screen font-sans relative">

    <!-- Navbar - Fixed to the top, styled like the scrolled state of Navbar.tsx -->
    <nav class="fixed top-0 w-full z-50 bg-taxi-dark shadow-lg py-2 transition-all duration-300">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <!-- Logo -->
          <a href="#home" class="flex-shrink-0 flex items-center gap-2">
            <div class="bg-taxi-yellow p-2 rounded-lg">
                <!-- Simple Car SVG icon (simulating Lucide-react Car) -->
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" class="car-icon">
                    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.6-.4-1-1-1h-1V9c0-1.7-1.3-3-3-3H8c-1.7 0-3 1.3-3 3v4H3c-.6 0-1 .4-1 1v3c0 .6.4 1 1 1h2c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2zM8 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm10 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-8 7h8v1c0 .6-.4 1-1 1H9c-.6 0-1-.4-1-1v-1z"/>
                </svg>
            </div>
            <span class="font-bold text-2xl text-white">
                City<span class="text-taxi-yellow">Car</span>
            </span>
          </a>

          <!-- Desktop Navigation Links and CTA -->
          <div class="hidden md:flex items-center space-x-6">
            <a href="/#home" class="text-white hover:text-taxi-yellow transition-colors font-medium">Home</a>
            <a href="/#services" class="text-white hover:text-taxi-yellow transition-colors font-medium">Services</a>
            <a href="/#fleet" class="text-white hover:text-taxi-yellow transition-colors font-medium">Fleet</a>
            <a href="/#about" class="text-white hover:text-taxi-yellow transition-colors font-medium">About</a>
            <a href="/#contact" class="text-white hover:text-taxi-yellow transition-colors font-medium">Contact</a>

            <a href="tel:+916377214055"
               class="bg-taxi-yellow text-taxi-dark px-5 py-2.5 rounded-full font-bold flex items-center gap-2 hover:bg-yellow-400 transition-transform transform hover:scale-105"
            >
                <!-- Simplified Phone SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" class="phone-icon">
                    <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 3.08 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
                <span>6377-214-055</span>
            </a>
          </div>

          <!-- Mobile Menu Button -->
          <div class="md:hidden flex items-center">
            <button id="mobileMenuButton" class="text-white hover:text-taxi-yellow focus:outline-none">
              <!-- Menu icon (default) -->
              <svg id="menuIcon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
              <!-- X icon (hidden by default) -->
              <svg id="xIcon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
      
      <!-- Mobile Menu -->
      <div id="mobileMenu" class="md:hidden bg-[#1f2937] border-t border-gray-800 hidden">
        <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
            <a href="/#home" class="block px-3 py-3 rounded-md text-base font-medium text-white hover:bg-gray-800 hover:text-taxi-yellow">Home</a>
            <a href="/#services" class="block px-3 py-3 rounded-md text-base font-medium text-white hover:bg-gray-800 hover:text-taxi-yellow">Services</a>
            <a href="/#fleet" class="block px-3 py-3 rounded-md text-base font-medium text-white hover:bg-gray-800 hover:text-taxi-yellow">Fleet</a>
            <a href="/#about" class="block px-3 py-3 rounded-md text-base font-medium text-white hover:bg-gray-800 hover:text-taxi-yellow">About</a>
            <a href="/#contact" class="block px-3 py-3 rounded-md text-base font-medium text-white hover:bg-gray-800 hover:text-taxi-yellow">Contact</a>

            <a href="tel:+916377214055" 
               class="block w-full text-center mt-4 bg-taxi-yellow text-taxi-dark px-3 py-3 rounded-md text-base font-bold transition-colors hover:bg-yellow-400"
            >
                Call Now: 6377-214-055
            </a>
        </div>
      </div>
    </nav>

    <!-- Main Content Wrapper to center the form below the fixed navbar -->
    <div class="w-full max-w-xl p-4 main-content">
        
        <!-- Main Container Card -->
        <div class="bg-white shadow-2xl rounded-xl overflow-hidden transform transition duration-500 hover:shadow-3xl">

            <!-- Form Header Section -->
            <div class="p-6 md:p-8 bg-gray-50 border-b border-gray-100">
                <h1 class="text-2xl font-bold tracking-tight mb-1 text-gray-900">
                    Book Your Ride
                </h1>
                <p class="text-gray-500 text-sm">
                    Fill the details and confirm your transfer instantly.
                </p>
            </div>

            <!-- Form Section -->
            <form id="rideBookingForm" class="p-6 md:p-8">
                
                <!-- Name and Phone Group -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Your Name</label>
                        <input type="text" id="name" required placeholder="Full Name" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150">
                    </div>
                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">Contact Number</label>
                        <input type="tel" id="phone" required placeholder="e.g., 9876543210" 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150">
                    </div>
                </div>

                <!-- Pickup Location -->
                <div class="mb-6">
                    <label for="pickup" class="block text-sm font-medium text-gray-700 mb-1">Pickup Location</label>
                    <input type="text" id="pickup" required placeholder="Enter full address or landmark" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150">
                </div>

                <!-- Dropoff Location -->
                <div class="mb-6">
                    <label for="dropoff" class="block text-sm font-medium text-gray-700 mb-1">Dropoff Location</label>
                    <input type="text" id="dropoff" required placeholder="Destination Address" 
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150">
                </div>
                
                <!-- Car Type Selection -->
                <div class="mb-6">
                    <label for="carType" class="block text-sm font-medium text-gray-700 mb-1">Select Car Type</label>
                    <select id="carType" required 
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150 appearance-none bg-white">
                        <option value="" disabled selected>Choose your vehicle class</option>
                        <option value="Standard Sedan">Standard Sedan (Swift Dzire / Etios)</option>
                        <option value="Premium SUV">Premium SUV (Innova Crysta)</option>
                        <option value="Luxury Van">Luxury Van (Tempo Traveller)</option>
                        <option value="Hatchback">Hatchback (Economy)</option>
                    </select>
                </div>
                
                <!-- Date and Time Group -->
                <div class="grid grid-cols-2 gap-6 mb-8">
                    <div>
                        <label for="date" class="block text-sm font-medium text-gray-700 mb-1">Date of Ride</label>
                        <input type="date" id="date" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150">
                    </div>
                    
                    <div>
                        <label for="time" class="block text-sm font-medium text-gray-700 mb-1">Time of Ride</label>
                        <input type="time" id="time" required 
                               class="w-full px-4 py-2 border border-gray-300 rounded-lg shadow-sm focus:ring-taxi-yellow focus:border-taxi-yellow transition duration-150">
                    </div>
                </div>

                <!-- Submit Button (WhatsApp themed) -->
                <button type="submit" 
                        class="w-full bg-whatsapp-green text-white py-3 rounded-lg font-bold text-lg shadow-md hover:bg-whatsapp-dark transition duration-200 flex items-center justify-center space-x-2 transform hover:scale-[1.01]">
                    <!-- Simple WhatsApp Icon (SVG for quality) -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" class="w-5 h-5 fill-white">
                        <path d="M380.9 97.1C339.4 55.4 283.4 33 224.2 33c-113.6 0-205.2 92.2-205.2 205.8 0 35.3 9.4 69.8 27.8 99.4L42.1 487.8c-1.3 4.4 2.8 8.5 7.2 7.2l157.9-39.7c28.5 15.4 60.1 23.8 93.3 23.8 113.6 0 205.2-92.2 205.2-205.8-.1-59.5-22.3-115-63.7-156.6zM224.2 433c-29.6 0-57.9-8.7-82.6-23.7l-5.6-3.3-57.2 14.3 14.6-55.7-3.6-5.8c-16.7-27-25.5-58.4-25.5-90.8 0-84.5 68.7-153.2 153.2-153.2s153.2 68.7 153.2 153.2c0 84.5-68.7 153.2-153.2 153.2zm65.5-126.3c-2.3-1.1-13.7-6.8-15.8-7.6-2.1-.8-3.6-1.1-5.1 1.1s-5.8 6.8-7.1 8.2c-1.3 1.5-2.7 1.7-5 0-9.7-4.8-21.7-11.9-30.8-19.3-7.5-6.1-15-13.6-21.7-22.5s-14.7-21.8-16.4-28.7c-1.7-6.8 0.4-10.4 2.7-12.7 2.1-2.1 4.8-5.3 7.1-7.9 2.3-2.6 3.1-4.4 4.7-7.3s.8-5.7-.3-8.1c-1.1-2.3-9.7-23.3-13.4-31.9-3.7-8.6-7.4-7.4-10.8-7.5-3.3-.1-6.9-.1-10.6-.1s-9.9 1.1-15.1 5.5c-5.1 4.3-19.5 18.9-19.5 45.9s20 53.2 22.9 56.9c2.9 3.7 39.8 60.5 97.4 85.5 57.5 25 57.5 16.8 63.8 15.8 6.3-1 20.3-8.3 23.2-16.3 2.9-7.9 2.9-14.8 2-16.3-1-1.4-3.6-2.2-7.6-4.1z"/>
                    </svg>
                    <span>Send Booking Request</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Toggle mobile menu visibility
        document.getElementById('mobileMenuButton').addEventListener('click', function() {
            const menu = document.getElementById('mobileMenu');
            const menuIcon = document.getElementById('menuIcon');
            const xIcon = document.getElementById('xIcon');
            
            menu.classList.toggle('hidden');
            
            if (menu.classList.contains('hidden')) {
                // Menu is closed, show Menu icon, hide X icon
                menuIcon.classList.remove('hidden');
                xIcon.classList.add('hidden');
            } else {
                // Menu is open, show X icon, hide Menu icon
                menuIcon.classList.add('hidden');
                xIcon.classList.remove('hidden');
            }
        });


        document.getElementById('rideBookingForm').addEventListener('submit', function(event) {
            event.preventDefault(); 

            // 1. Get Form Data
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const pickup = document.getElementById('pickup').value.trim();
            const dropoff = document.getElementById('dropoff').value.trim();
            // Get Car Type
            const carType = document.getElementById('carType').value;
            const date = document.getElementById('date').value;
            const time = document.getElementById('time').value;

            // 2. Format the message for WhatsApp
            const message = encodeURIComponent(
                `*NEW PREMIUM RIDE BOOKING REQUEST*
                
*Customer Name:* ${name}
*Contact No.:* ${phone}
*Car Type:* ${carType}
*Date & Time:* ${date} at ${time}
*Pickup Location:* ${pickup}
*Dropoff Location:* ${dropoff}
                
---
Please review and confirm this booking promptly. Thank you.`
            );

            // 3. Construct the WhatsApp API URL (Target number: 6377214055, assuming India code 91)
            const targetNumber = '916377214055'; 
            
            const whatsappURL = `https://wa.me/${targetNumber}?text=${message}`;

            // 4. Redirect the user to WhatsApp
            window.open(whatsappURL, '_blank');
        });
    </script>

</body>
</html>
